<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVQ - Sistema Integrado</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="assets/img/logo-gvq.png" alt="Logo GVQ" onerror="this.style.display='none'">
            <h1>SISTEMA DE COMPRAS</h1>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Fazer Login</div>
            <div class="tab" onclick="switchTab('cadastro')">Nova Conta</div>
        </div>
        
        <div class="form-container">
            <div id="login-form" class="form-content active">
                <form id="form-login">
                    <div class="form-group">
                        <label>Login de Usuário</label>
                        <input type="text" id="login_usuario" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="login_senha" required autocomplete="current-password">
                    </div>
                    <button type="submit" id="btn-entrar" class="btn">Entrar no Sistema</button>
                </form>
            </div>
            
            <div id="cadastro-form" class="form-content">
                <form id="form-cadastro">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" id="cad_nome" required onkeyup="gerarUsuario()">
                        <span class="user-hint" id="hint-usuario" style="display:none;">Seu login será: <strong id="usuario-gerado"></strong></span>
                    </div>
                    <div class="form-group">
                        <label>Função / Perfil</label>
                        <select id="cad_perfil" required>
                            <option value="" disabled selected>Selecione sua área...</option>
                            <option value="comprador">Comprador</option>
                            <option value="escritorio">Escritório</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Criar Senha (Mínimo 6 dígitos)</label>
                        <input type="password" id="cad_senha" minlength="6" required>
                    </div>
                    <button type="submit" id="btn-cadastrar" class="btn" style="background-color: var(--azul-gvq);">Solicitar Cadastro</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
