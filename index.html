<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVQ - Sistema Integrado</title>
    <style>
        :root { --verde-gvq: #00A859; --azul-gvq: #110145; --fundo: #f4f7f6; --cinza: #ccc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--fundo); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #ffffff; border-radius: 10px; box-shadow: 0 4px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; overflow: hidden; }
        .header { text-align: center; padding: 35px 20px 15px; background-color: white; }
        .header img { max-width: 180px; margin-bottom: 10px; }
        .header h1 { font-size: 15px; color: var(--azul-gvq); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
        .tabs { display: flex; border-bottom: 1px solid var(--cinza); margin-bottom: 25px; background: #fdfdfd; }
        .tab { flex: 1; text-align: center; padding: 15px; cursor: pointer; font-weight: bold; color: #888; transition: 0.3s; font-size: 14px; }
        .tab.active { color: var(--azul-gvq); border-bottom: 3px solid var(--verde-gvq); background: white; }
        .form-container { padding: 0 30px 35px; }
        .form-content { display: none; animation: fadeIn 0.4s; }
        .form-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: var(--azul-gvq); }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--cinza); border-radius: 6px; font-size: 15px; outline: none; background-color: #fafafa; transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--verde-gvq); background-color: white; box-shadow: 0 0 0 3px rgba(0,168,89,0.1); }
        .user-hint { font-size: 12px; color: #155724; margin-top: 5px; display: block; background: #d4edda; padding: 8px; border-radius: 4px; border-left: 3px solid var(--verde-gvq); }
        .btn { width: 100%; padding: 14px; background-color: var(--verde-gvq); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn:hover { background-color: #008f4c; }
        .btn:disabled { background-color: #7ab596; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="LOGO 1.png" alt="Logo GVQ" onerror="this.style.display='none'">
            <h1>SISTEMA DE COMPRAS</h1>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Fazer Login</div>
            <div class="tab" onclick="switchTab('cadastro')">Nova Conta</div>
        </div>
        
        <div class="form-container">
            <div id="login-form" class="form-content active">
                <form id="form-login">
                    <div class="form-group">
                        <label>Login de Usuário</label>
                        <input type="text" id="login_usuario" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="login_senha" required autocomplete="current-password">
                    </div>
                    <button type="submit" id="btn-entrar" class="btn">Entrar no Sistema</button>
                </form>
            </div>
            
            <div id="cadastro-form" class="form-content">
                <form id="form-cadastro">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" id="cad_nome" required onkeyup="gerarUsuario()">
                        <span class="user-hint" id="hint-usuario" style="display:none;">Seu login será: <strong id="usuario-gerado"></strong></span>
                    </div>
                    <div class="form-group">
                        <label>Função / Perfil</label>
                        <select id="cad_perfil" required>
                            <option value="" disabled selected>Selecione sua área...</option>
                            <option value="comprador">Comprador</option>
                            <option value="escritorio">Escritório</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Criar Senha (Mínimo 6 dígitos)</label>
                        <input type="password" id="cad_senha" minlength="6" required>
                    </div>
                    <button type="submit" id="btn-cadastrar" class="btn" style="background-color: var(--azul-gvq);">Solicitar Cadastro</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwxmAaWkFhlSxQhL8OidoKSjMkLGDgC5k",
            authDomain: "gvq-sistema-compras.firebaseapp.com",
            projectId: "gvq-sistema-compras",
            storageBucket: "gvq-sistema-compras.firebasestorage.app",
            messagingSenderId: "491539228108",
            appId: "1:491539228108:web:06a4e13caa1bb2cced2969"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); 
            document.querySelectorAll('.form-content').forEach(f => f.classList.remove('active'));
            if(tab === 'login') { 
                document.querySelectorAll('.tab')[0].classList.add('active'); 
                document.getElementById('login-form').classList.add('active'); 
            } else { 
                document.querySelectorAll('.tab')[1].classList.add('active'); 
                document.getElementById('cadastro-form').classList.add('active'); 
            }
        }

        window.gerarUsuario = function() {
            const nome = document.getElementById('cad_nome').value.trim(); 
            const hint = document.getElementById('hint-usuario');
            if(nome.includes(' ')) {
                let partes = nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().split(' ').filter(p => p.length > 0);
                if(partes.length > 1) { 
                    document.getElementById('usuario-gerado').innerText = `${partes[0]}.${partes[partes.length - 1]}`; 
                    hint.style.display = 'block'; return; 
                }
            }
            hint.style.display = 'none';
        }

        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-cadastrar');
            btn.innerText = "Processando...";
            btn.disabled = true;

            const nome = document.getElementById('cad_nome').value.trim();
            const perfil = document.getElementById('cad_perfil').value;
            const senha = document.getElementById('cad_senha').value;
            
            let partes = nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().split(' ').filter(p => p.length > 0);
            let login = `${partes[0]}.${partes[partes.length - 1]}`;
            let emailFake = `${login}@gvq.com.br`; 

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, emailFake, senha);
                const uid = userCredential.user.uid;
                
                await setDoc(doc(db, "usuarios", uid), {
                    nome: nome,
                    login: login,
                    perfil: perfil,
                    aprovado: (perfil === 'comprador')
                });

                if(perfil === 'escritorio') { 
                    alert('Cadastro solicitado com sucesso! Contas de Escritório precisam de aprovação.'); 
                } else { 
                    alert('Conta criada com sucesso! O seu login é: ' + login); 
                }
                
                document.getElementById('login_usuario').value = login;
                window.switchTab('login');
                document.getElementById('form-cadastro').reset();
                document.getElementById('hint-usuario').style.display = 'none';

            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    alert('Este usuário já está cadastrado no sistema.');
                } else if (error.code === 'auth/weak-password') {
                    alert('A senha deve ter pelo menos 6 caracteres.');
                } else {
                    alert("Erro ao criar conta: " + error.message);
                }
            } finally {
                btn.innerText = "Solicitar Cadastro";
                btn.disabled = false;
            }
        });

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-entrar');
            btn.innerText = "Autenticando...";
            btn.disabled = true;

            const loginInput = document.getElementById('login_usuario').value.toLowerCase().trim();
            const senhaInput = document.getElementById('login_senha').value;
            const emailFake = `${loginInput}@gvq.com.br`;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, emailFake, senhaInput);
                const uid = userCredential.user.uid;
                
                const docSnap = await getDoc(doc(db, "usuarios", uid));
                
                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    
                    if(userData.perfil === 'escritorio' && !userData.aprovado) {
                        alert('A sua conta está em análise. Aguarde aprovação da administração.');
                        await auth.signOut();
                        btn.innerText = "Entrar no Sistema";
                        btn.disabled = false;
                        return;
                    }
                    
                    localStorage.setItem('gvq_sistema_logado', userData.nome);
                    localStorage.setItem('gvq_sistema_perfil', userData.perfil);
                    
                    window.location.href = userData.perfil === 'escritorio' ? 'escritorio.html' : 'painel.html';
                } else {
                    alert("Perfil não encontrado no banco de dados.");
                    await auth.signOut();
                }
            } catch (error) {
                alert("Login ou senha incorretos!");
            } finally {
                btn.innerText = "Entrar no Sistema";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
